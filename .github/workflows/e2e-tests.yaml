name: Electron E2E Tests

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    e2e-tests:
        name: Electron E2E on Windows
        runs-on: windows-latest
        timeout-minutes: 40
        env:
            CI: 'true'
            NX_DAEMON: 'false'
            PLAYWRIGHT_HTML_OPEN: never
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Test Electron
              run: pnpm nx run electron-backend-e2e:e2e --outputStyle=static
            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4.6.2
              with:
                  name: electron-e2e-reports
                  path: |
                      dist/playwright-report/electron-backend-e2e/
                      dist/test-results/electron-backend-e2e/
                  retention-days: 7

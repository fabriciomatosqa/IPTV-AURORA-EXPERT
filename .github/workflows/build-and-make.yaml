name: Build and Make Electron App

on:
    push:
        branches:
            - main
        tags:
            - 'v*.*.*'
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    build:
        name: Build on ${{ matrix.os }} ${{ matrix.arch }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        strategy:
            matrix:
                include:
                    # macOS builds - separate runners to avoid native module conflicts
                    - os: macos
                      runner: macos-15-intel
                      arch: x64
                    - os: macos
                      runner: macos-latest
                      arch: arm64
                    # Linux and Windows
                    - os: linux
                      runner: ubuntu-latest
                    - os: windows
                      runner: windows-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24.15.0'
                  cache: 'pnpm'

            - name: Install Linux system dependencies
              if: matrix.os == 'linux'
              run: sudo apt-get install --no-install-recommends -y rpm libarchive-tools

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build frontend
              run: pnpm nx build web --skip-nx-cache

            - name: Build backend
              run: pnpm run build:backend

            - name: Make Electron app
              if: matrix.os != 'macos'
              run: pnpm run make:app

            - name: Make Electron app (macOS)
              if: matrix.os == 'macos'
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
                  CSC_FOR_PULL_REQUEST: 'false'
                  CSC_LINK: ''
                  CSC_KEY_PASSWORD: ''
              run: pnpm run make:app

            - name: Upload artifacts (macOS)
              if: matrix.os == 'macos'
              uses: actions/upload-artifact@v4.6.2
              with:
                  name: macos-${{ matrix.arch }}-artifacts
                  path: |
                      dist/executables/**/*.dmg
                      dist/executables/**/*.zip
                  retention-days: 7

            - name: Upload artifacts (Linux)
              if: matrix.os == 'linux'
              uses: actions/upload-artifact@v4.6.2
              with:
                  name: linux-artifacts
                  path: |
                      dist/executables/**/*.deb
                      dist/executables/**/*.rpm
                      dist/executables/**/*.snap
                      dist/executables/**/*.AppImage
                      dist/executables/**/*.tar.gz
                      dist/executables/**/*.pacman
                      dist/executables/**/*.flatpak
                  retention-days: 7

            - name: Upload artifacts (Windows)
              if: matrix.os == 'windows'
              uses: actions/upload-artifact@v4.6.2
              with:
                  name: windows-artifacts
                  path: |
                      dist/executables/**/*.exe
                      dist/executables/**/*.msi
                      dist/executables/**/*.zip
                  retention-days: 7

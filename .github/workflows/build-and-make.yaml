name: Build Windows Installer

on:
    push:
        branches:
            - main
            - 'feat/**'
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            publish_release:
                description: 'Publicar nova release com atualização pelo aplicativo'
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: windows-installer-${{ github.ref }}
    cancel-in-progress: true

jobs:
    windows:
        name: Build and verify Windows x64 installer
        runs-on: windows-latest
        timeout-minutes: 60
        env:
            CI: 'true'
            NX_DAEMON: 'false'
            PLAYWRIGHT_HTML_OPEN: never
            CSC_IDENTITY_AUTO_DISCOVERY: 'false'

        steps:
            - name: Checkout source
              uses: actions/checkout@v4
            - name: Install pnpm
              uses: pnpm/action-setup@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Prepare next daily release version
              if: github.event_name == 'workflow_dispatch' && inputs.publish_release
              run: node scripts/prepare-release.cjs
            - name: Run unit tests
              run: pnpm nx run-many -t test --parallel=2 --runInBand --outputStyle=static
            - name: Build verified Windows installer
              run: pnpm nx run electron-backend:make --outputStyle=static
            - name: Verify SQLite data isolation and migrations
              run: pnpm nx run electron-backend:verify-data --outputStyle=static
            - name: Test packaged application
              shell: pwsh
              run: |
                  $env:AURORA_E2E_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'dist/executables/win-unpacked/IPTV AURORA EXPERT.exe'
                  $env:AURORA_E2E_PROFILE_BASE = Join-Path $env:RUNNER_TEMP 'aurora-e2e-profiles'
                  $env:AURORA_E2E_UPDATE_INSTALLER = (Get-ChildItem -LiteralPath 'dist/executables' -Filter '*-windows-x64-setup.exe' | Select-Object -First 1).FullName
                  New-Item -ItemType Directory -Path $env:AURORA_E2E_PROFILE_BASE -Force | Out-Null
                  pnpm nx run-many -t e2e -p electron-backend-e2e --excludeTaskDependencies --skipNxCache --outputStyle=static
            - name: Record installer SHA-256
              shell: pwsh
              run: |
                  $setups = @(Get-ChildItem -LiteralPath 'dist/executables' -Filter '*-windows-x64-setup.exe')
                  if ($setups.Count -ne 1) { throw 'Expected exactly one Windows x64 installer' }
                  $setup = $setups[0]
                  $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash
                  "$hash  $($setup.Name)" | Set-Content -LiteralPath 'dist/executables/SHA256SUMS.txt' -Encoding utf8
                  [ordered]@{
                      file = $setup.Name
                      bytes = $setup.Length
                      sha256 = $hash
                      commit = $env:GITHUB_SHA
                      branch = $env:GITHUB_REF_NAME
                      run = $env:GITHUB_RUN_ID
                  } | ConvertTo-Json | Set-Content -LiteralPath 'dist/executables/build-info.json' -Encoding utf8
            - name: Upload Windows installer for download
              id: installer
              uses: actions/upload-artifact@v4.6.2
              with:
                  name: IPTV-AURORA-EXPERT-Windows-x64
                  path: |
                      dist/executables/*-windows-x64-setup.exe
                      dist/executables/SHA256SUMS.txt
                      dist/executables/build-info.json
                      dist/executables/latest.yml
                      dist/executables/*.blockmap
                  if-no-files-found: error
                  retention-days: 30
                  compression-level: 0
            - name: Add download link to run summary
              shell: pwsh
              env:
                  INSTALLER_ARTIFACT_URL: ${{ steps.installer.outputs.artifact-url }}
              run: |
                  @"
                  ## IPTV AURORA EXPERT — Windows x64
                  [Baixar o instalador verificado]($env:INSTALLER_ARTIFACT_URL)

                  Extraia o ZIP e execute o arquivo de instalação .exe. O pacote inclui SHA256SUMS.txt e build-info.json.
                  Artefato disponível por 30 dias. O download pelo Actions exige login no GitHub.
                  A opção publish_release publica a próxima versão diária após todos os testes. O código da main não é alterado pelo workflow.
                  "@ >> $env:GITHUB_STEP_SUMMARY
            - name: Publish verified daily release
              if: github.event_name == 'workflow_dispatch' && inputs.publish_release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $metadata = Get-Content package.json -Raw | ConvertFrom-Json
                  $tag = "v$($metadata.auroraVersion)"
                  $assets = @(Get-ChildItem -LiteralPath 'dist/executables' -File | Where-Object { $_.Name -match 'windows-x64-setup\.exe(\.blockmap)?$|^latest\.yml$|^SHA256SUMS\.txt$|^build-info\.json$' } | ForEach-Object { $_.FullName })
                  gh release create $tag @assets --target $env:GITHUB_SHA --title "IPTV AURORA EXPERT $($metadata.auroraVersion)" --generate-notes --latest
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Upload diagnostics on failure
              if: failure()
              uses: actions/upload-artifact@v4.6.2
              with:
                  name: windows-build-diagnostics
                  path: |
                      dist/playwright-report/electron-backend-e2e/
                      dist/test-results/electron-backend-e2e/
                  retention-days: 7

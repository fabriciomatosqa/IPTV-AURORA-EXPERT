<section class="hero" [class.hero--series]="layout() === 'series'">
    <button
        class="hero__back-button"
        type="button"
        aria-label="Voltar ao catálogo"
        (click)="onBack()"
    >
        <mat-icon>close</mat-icon>
    </button>
    @if (errorMessage()) {
        <div class="hero__error">
            <mat-icon>cloud_off</mat-icon>
            <h2>{{ errorMessage() }}</h2>
            <ng-content select="[hero-error-actions]"></ng-content>
        </div>
    } @else if (isLoading()) {
        <div class="hero__loading">
            <ngx-skeleton-loader
                count="3"
                [theme]="{
                    height: '36px',
                    width: '80%',
                    'margin-bottom': '28px',
                }"
            />
        </div>
    } @else {
        <div
            class="hero__backdrop"
            [style.backgroundImage]="
                'url(' + (backdropUrl() || posterUrl() || '') + ')'
            "
            aria-hidden="true"
        ></div>
        <div class="hero__vignette"></div>
        <div class="hero__scroll">
            <div class="hero__content">
                <div class="details">
                    <h1 class="details__title">{{ title() }}</h1>
                    @if (description()) {
                        <p class="details__description">{{ description() }}</p>
                    }
                    <div class="details__meta">
                        <ng-content select="[hero-meta]"></ng-content>
                    </div>
                    <div class="details__tags">
                        <ng-content select="[hero-tags]"></ng-content>
                    </div>
                    <div class="action-buttons">
                        <ng-content select="[hero-actions]"></ng-content>
                    </div>
                </div>
                <div class="poster">
                    @if (posterUrl()) {
                        <img
                            class="poster__image"
                            [src]="posterUrl()"
                            (error)="
                                $any($event.target).style.visibility = 'hidden'
                            "
                            [alt]="title() || 'Pôster'"
                        />
                    } @else {
                        <div class="poster__placeholder">
                            <mat-icon>movie</mat-icon>
                        </div>
                    }
                </div>
            </div>
            <div class="hero__additional"><ng-content></ng-content></div>
        </div>
    }
</section>

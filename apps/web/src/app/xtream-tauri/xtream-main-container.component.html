<div
    class="main-content"
    [class.details-open]="
        !!xtreamStore.selectedItem() || xtreamStore.isLoadingDetails()
    "
>
    @if (!xtreamStore.selectedItem() && !xtreamStore.isLoadingDetails()) {
        <div class="content-header">
            <div class="header-left">
                <label class="category-heading" for="xtream-category"
                    >Categorias <mat-icon>expand_circle_down</mat-icon></label
                >
                <select
                    id="xtream-category"
                    aria-label="Selecionar categoria"
                    [value]="selectedCategoryId() ?? ''"
                    (change)="selectCategoryById($any($event.target).value)"
                >
                    <option value="">Todas</option>
                    @for (
                        category of categories();
                        track $any(category).category_id ?? category.id
                    ) {
                        <option
                            [value]="$any(category).category_id ?? category.id"
                        >
                            {{ $any(category).category_name ?? category.name }}
                        </option>
                    }
                </select>
            </div>
            @if (canShowFilterButton()) {
                <div class="header-actions">
                    @if (isCategorySearchOpen()) {
                        <mat-form-field
                            class="category-search"
                            appearance="outline"
                            subscriptSizing="dynamic"
                        >
                            <mat-icon matPrefix>search</mat-icon>
                            <input
                                matInput
                                type="search"
                                spellcheck="false"
                                [ngModel]="categorySearchTerm()"
                                (ngModelChange)="onCategorySearchChange($event)"
                                placeholder="Pesquisar"
                                aria-label="Pesquisar no catálogo"
                            />
                            @if (categorySearchTerm()) {
                                <button
                                    mat-icon-button
                                    matSuffix
                                    aria-label="Clear search"
                                    (click)="clearCategorySearch()"
                                >
                                    <mat-icon>close</mat-icon>
                                </button>
                            }
                        </mat-form-field>
                    }
                    <button
                        mat-icon-button
                        (click)="openCategoryManagement()"
                        aria-label="Gerenciar categorias"
                    >
                        <mat-icon>tune</mat-icon>
                    </button>
                    @if (canShowSortMenu()) {
                        <mat-menu #xtreamSortMenu="matMenu">
                            <button
                                mat-menu-item
                                (click)="setContentSortMode('date-desc')"
                            >
                                <span>Date Added (Latest First)</span>
                                @if (contentSortMode() === 'date-desc') {
                                    <mat-icon>check</mat-icon>
                                }
                            </button>
                            <button
                                mat-menu-item
                                (click)="setContentSortMode('date-asc')"
                            >
                                <span>Date Added (Oldest First)</span>
                                @if (contentSortMode() === 'date-asc') {
                                    <mat-icon>check</mat-icon>
                                }
                            </button>
                            <button
                                mat-menu-item
                                (click)="setContentSortMode('name-asc')"
                            >
                                <span>Name A-Z</span>
                                @if (contentSortMode() === 'name-asc') {
                                    <mat-icon>check</mat-icon>
                                }
                            </button>
                            <button
                                mat-menu-item
                                (click)="setContentSortMode('name-desc')"
                            >
                                <span>Name Z-A</span>
                                @if (contentSortMode() === 'name-desc') {
                                    <mat-icon>check</mat-icon>
                                }
                            </button>
                        </mat-menu>
                        <button
                            mat-icon-button
                            [matMenuTriggerFor]="xtreamSortMenu"
                            [matTooltip]="'Sort: ' + contentSortLabel()"
                            aria-label="Sort content"
                        >
                            <mat-icon>sort</mat-icon>
                        </button>
                    }
                </div>
            }
        </div>
    }
    <div
        class="scrollable-content"
        [class.no-header]="
            xtreamStore.selectedItem() || xtreamStore.isLoadingDetails()
        "
    >
        <router-outlet />
    </div>
    <!-- <app-mpv-player-bar /> -->
</div>

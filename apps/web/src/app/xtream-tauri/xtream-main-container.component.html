<div
    class="catalog-layout"
    [class.details-open]="
        !!xtreamStore.selectedItem() || xtreamStore.isLoadingDetails()
    "
>
    @if (!xtreamStore.selectedItem() && !xtreamStore.isLoadingDetails()) {
        <aside
            class="vod-category-sidebar"
            [style.--aurora-category-width.px]="categoryColumnWidth()"
            data-test-id="vod-category-sidebar"
            aria-label="Categorias de filmes e séries"
        >
            <div class="vod-sidebar-header">
                <h2>Categorias</h2>
                <button
                    mat-icon-button
                    type="button"
                    aria-label="Gerenciar categorias"
                    [matTooltip]="'Gerenciar categorias'"
                    (click)="openCategoryManagement()"
                >
                    <mat-icon>tune</mat-icon>
                </button>
            </div>
            <label class="vod-sidebar-search">
                <mat-icon>search</mat-icon>
                <input
                    type="search"
                    aria-label="Pesquisar categorias de filmes e séries"
                    placeholder="Pesquisar categorias"
                    [value]="sidebarSearch()"
                    (input)="sidebarSearch.set($any($event.target).value)"
                />
                @if (sidebarSearch()) {
                    <button
                        type="button"
                        aria-label="Limpar busca de categorias"
                        (click)="sidebarSearch.set('')"
                    >
                        <mat-icon>close</mat-icon>
                    </button>
                }
            </label>
            <button
                class="vod-all-categories"
                type="button"
                [class.selected]="selectedCategoryId() == null"
                [attr.aria-pressed]="selectedCategoryId() == null"
                (click)="selectCategoryById('')"
            >
                <mat-icon>apps</mat-icon>
                <span>Todas</span>
            </button>
            <app-category-view
                [items]="filteredSidebarCategories()"
                [selectedCategoryId]="selectedCategoryId()"
                [itemCounts]="categoryItemCounts()"
                [showCounts]="true"
                (categoryClicked)="categoryClicked($event)"
            />
        </aside>
    }
    <div
        class="main-content"
        [class.details-open]="
            !!xtreamStore.selectedItem() || xtreamStore.isLoadingDetails()
        "
    >
        @if (!xtreamStore.selectedItem() && !xtreamStore.isLoadingDetails()) {
            <div class="content-header">
                <h2 class="catalog-heading">{{ selectedCatalogHeading() }}</h2>
                @if (canShowFilterButton()) {
                    <div class="header-actions">
                        @if (isCategorySearchOpen()) {
                            <mat-form-field
                                class="category-search"
                                appearance="outline"
                                subscriptSizing="dynamic"
                            >
                                <mat-icon matPrefix>search</mat-icon>
                                <input
                                    matInput
                                    type="search"
                                    spellcheck="false"
                                    [ngModel]="categorySearchTerm()"
                                    (ngModelChange)="onCategorySearchChange($event)"
                                    placeholder="Pesquisar títulos"
                                    aria-label="Pesquisar no catálogo"
                                />
                                @if (categorySearchTerm()) {
                                    <button
                                        mat-icon-button
                                        matSuffix
                                        aria-label="Limpar pesquisa de títulos"
                                        (click)="clearCategorySearch()"
                                    >
                                        <mat-icon>close</mat-icon>
                                    </button>
                                }
                            </mat-form-field>
                        }
                        <mat-menu #xtreamSortMenu="matMenu">
                            <button
                                mat-menu-item
                                (click)="setContentSortMode('date-desc')"
                            >
                                <span>Adicionados recentemente</span>
                                @if (contentSortMode() === 'date-desc') {
                                    <mat-icon>check</mat-icon>
                                }
                            </button>
                            <button
                                mat-menu-item
                                (click)="setContentSortMode('date-asc')"
                            >
                                <span>Mais antigos primeiro</span>
                                @if (contentSortMode() === 'date-asc') {
                                    <mat-icon>check</mat-icon>
                                }
                            </button>
                            <button
                                mat-menu-item
                                (click)="setContentSortMode('name-asc')"
                            >
                                <span>Nome A–Z</span>
                                @if (contentSortMode() === 'name-asc') {
                                    <mat-icon>check</mat-icon>
                                }
                            </button>
                            <button
                                mat-menu-item
                                (click)="setContentSortMode('name-desc')"
                            >
                                <span>Nome Z–A</span>
                                @if (contentSortMode() === 'name-desc') {
                                    <mat-icon>check</mat-icon>
                                }
                            </button>
                        </mat-menu>
                        <button
                            mat-icon-button
                            [matMenuTriggerFor]="xtreamSortMenu"
                            [matTooltip]="'Ordenar: ' + contentSortLabel()"
                            aria-label="Ordenar títulos"
                        >
                            <mat-icon>sort</mat-icon>
                        </button>
                    </div>
                }
            </div>
        }
        <div
            class="scrollable-content"
            [class.no-header]="
                xtreamStore.selectedItem() || xtreamStore.isLoadingDetails()
            "
        >
            <router-outlet />
        </div>
    </div>
</div>

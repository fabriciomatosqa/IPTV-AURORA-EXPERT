<div class="catalog-layout">
    <app-aurora-catalog-navigation
        data-test-id="stalker-category-sidebar"
        mode="library"
        [categories]="auroraCategories()"
        [selectedId]="stalkerStore.selectedCategoryId()"
        [loading]="isCategoryLoading()"
        [loadFailed]="isCategoryFailed()"
        (categorySelected)="selectAuroraCategory($event)" />


<div class="main-content">
    @if (!stalkerStore.selectedItem()) {
        <div class="content-header">
            <h2>
                <button mat-icon-button disabled>
                    <mat-icon>category</mat-icon>
                </button>

                {{ getContentLabel() }}

                @if (
                    !contentItems() &&
                    !isContentLoading() &&
                    !stalkerStore.selectedCategoryId()
                ) {
                    <h2>
                        {{ 'PORTALS.SELECT_CATEGORY' | translate }}
                    </h2>
                }
            </h2>
        </div>
    }

    <div
        class="scrollable-content"
        [class.no-header]="stalkerStore.selectedItem()"
    >
        <router-outlet />
    </div>
</div>
</div>

<div class="catalog-layout">
    <aside class="vod-category-sidebar"
        [style.--aurora-category-width.px]="categoryColumnWidth()"
        data-test-id="stalker-category-sidebar"
        aria-label="Categorias de filmes e séries">
        <div class="vod-sidebar-header">
            <h2>Categorias</h2>
        </div>
        <label class="vod-sidebar-search">
            <mat-icon>search</mat-icon>
            <input type="search" aria-label="Pesquisar categorias"
                placeholder="Pesquisar categorias"
                [value]="categoryQuery()"
                (input)="categoryQuery.set($any($event.target).value)" />
        </label>
        <button type="button" class="vod-all-categories"
            [class.selected]="!stalkerStore.selectedCategoryId() || stalkerStore.selectedCategoryId() === '*'"
            [attr.aria-pressed]="!stalkerStore.selectedCategoryId() || stalkerStore.selectedCategoryId() === '*'"
            (click)="selectAllCategories()">
            <mat-icon>apps</mat-icon><span>Todas</span>
        </button>
        @if (isCategoryLoading()) {
            <ngx-skeleton-loader count="12" [theme]="{width:'90%',height:'42px'}" />
        } @else if (isCategoryFailed()) {
            <app-playlist-error-view
                [title]="'PORTALS.ERROR_VIEW.UNKNOWN_ERROR.TITLE' | translate"
                [description]="'PORTALS.ERROR_VIEW.UNKNOWN_ERROR.DESCRIPTION' | translate" />
        } @else {
            <app-category-view
                [items]="filteredCategories()"
                [selectedCategoryId]="$any(stalkerStore.selectedCategoryId())"
                (categoryClicked)="categoryClicked($event)" />
        }
    </aside>

<div class="main-content">
    @if (!stalkerStore.selectedItem()) {
        <div class="content-header">
            <h2>
                <button mat-icon-button disabled>
                    <mat-icon>category</mat-icon>
                </button>

                {{ getContentLabel() }}

                @if (
                    !contentItems() &&
                    !isContentLoading() &&
                    !stalkerStore.selectedCategoryId()
                ) {
                    <h2>
                        {{ 'PORTALS.SELECT_CATEGORY' | translate }}
                    </h2>
                }
            </h2>
        </div>
    }

    <div
        class="scrollable-content"
        [class.no-header]="stalkerStore.selectedItem()"
    >
        <router-outlet />
    </div>
</div>
</div>

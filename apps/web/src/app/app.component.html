<router-outlet />

<app-epg-progress-panel />
@if (playlistLoading.active()) {
    <div
        class="playlist-loading-screen"
        data-test-id="playlist-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
    >
        <div class="playlist-loading-card">
            <div class="playlist-spinner" aria-hidden="true"></div>
            <h2>{{ playlistLoading.message() }}</h2>
            @if (playlistLoading.percent() !== null) {
                <progress
                    max="100"
                    [value]="playlistLoading.percent()"
                    aria-label="Progresso da lista"
                ></progress>
                <p>{{ playlistLoading.percent() }}%</p>
            }
            <p>Aguarde enquanto a lista é preparada.</p>
        </div>
    </div>
}
